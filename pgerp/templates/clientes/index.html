{% extends "base.html" %}

{% block content %}
<div class="flex justify-between items-center mb-6">
  <h2 class="text-xl font-bold">Clientes</h2>
  <a href="/clientes/create" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
    + Nuevo Cliente
  </a>
</div>

<form class="mb-4" hx-get="/clientes" hx-push-url="true">
  <div class="flex gap-2">
    <input type="text" name="q" placeholder="Buscar clientes..." class="flex-1 px-4 py-2 border rounded-lg"
      value="{{ request.get('q', '') }}">
    <button class="px-4 py-2 bg-gray-100 rounded-lg">Buscar</button>
  </div>
</form>

<div class="bg-white rounded-lg shadow overflow-x-auto">
  <table class="w-full">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">Nombre</th>
        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">RFC</th>
        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">Email</th>
        <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">Teléfono</th>
        <th class="px-4 py-3 text-center text-xs font-medium text-gray-500">Acciones</th>
      </tr>
    </thead>
    <tbody>
      {% for c in items %}
      <tr class="border-t">
        <td class="px-4 py-3">{{ c.nombre }}</td>
        <td class="px-4 py-3">{{ c.rfc or "-" }}</td>
        <td class="px-4 py-3">{{ c.email or "-" }}</td>
        <td class="px-4 py-3">{{ c.telefono or "-" }}</td>
        <td class="px-4 py-3 text-center">
          <a href="/clientes/{{ c.id }}" class="text-blue-600 hover:text-blue-900 mr-2">Ver</a>
          <a href="/clientes/{{ c.id }}/edit" class="text-yellow-600 hover:text-yellow-900 mr-2">Editar</a>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="5" class="px-4 py-8 text-center text-gray-500">No hay clientes</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
