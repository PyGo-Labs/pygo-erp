{% extends "base.html" %}

{% block content %}
<h2 class="text-xl font-bold mb-6">{{ producto.id and "Editar" or "Nuevo" }} Producto</h2>

<form method="POST" action="{{ producto.id and "/productos/" + producto.id or "/productos" }}" class="space-y-4">
  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-700">Código</label>
      <input type="text" name="codigo" value="{{ producto.codigo or "" }}" required class="w-full px-4 py-2 border rounded-lg">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Nombre</label>
      <input type="text" name="nombre" value="{{ producto.nombre or "" }}" required class="w-full px-4 py-2 border rounded-lg">
    </div>
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700">Descripción</label>
    <textarea name="descripcion" rows="3" class="w-full px-4 py-2 border rounded-lg">{{ producto.descripcion or "" }}</textarea>
  </div>

  <div class="grid grid-cols-3 gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-700">Precio Unitario</label>
      <input type="number" step="0.01" name="precio_unitario" value="{{ producto.precio_unitario or "0.00" }}" required class="w-full px-4 py-2 border rounded-lg">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Tipo</label>
      <select name="tipo" class="w-full px-4 py-2 border rounded-lg">
        <option value="producto" {{ "selected" if producto.tipo == "producto" else "" }}>Producto</option>
        <option value="servicio" {{ "selected" if producto.tipo == "servicio" else "" }}>Servicio</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Categoría</label>
      <select name="categoria" class="w-full px-4 py-2 border rounded-lg">
        <option value="">Selecciona...</option>
        {% for c in categorias %}
        <option value="{{ c.id }}" {{ "selected" if c.id == producto.categoria else "" }}>{{ c.nombre }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="flex justify-end gap-2">
    <a href="/productos" class="px-4 py-2 text-gray-600">Cancelar</a>
    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Guardar</button>
  </div>
</form>
{% endblock %}
