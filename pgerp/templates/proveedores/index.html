{% extends "base.html" %}

{% block content %}
<div class="flex justify-between items-center mb-6">
  <h2 class="text-xl font-bold">Proveedores</h2>
  <a href="/proveedores/create" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
    + Nuevo Proveedor
  </a>
</div>

<form class="mb-4" hx-get="/proveedores" hx-push-url="true">
  <input type="text" name="q" placeholder="Buscar proveedores..." class="flex-1 px-4 py-2 border rounded-lg"
    value="{{ request.get('q', '') }}">
</form>

<div class="bg-white rounded-lg shadow overflow-x-auto">
  <table class="w-full">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-4 py-3 text-xs font-medium">Nombre</th>
        <th class="px-4 py-3 text-xs font-medium">RFC</th>
        <th class="px-4 py-3 text-xs font-medium">Email</th>
        <th class="px-4 py-3 text-xs font-medium">Teléfono</th>
        <th class="px-4 py-3 text-center text-xs font-medium">Acciones</th>
      </tr>
    </thead>
    <tbody>
      {% for p in items %}
      <tr class="border-t">
        <td class="px-4 py-3">{{ p.nombre }}</td>
        <td class="px-4 py-3">{{ p.rfc or "-" }}</td>
        <td class="px-4 py-3">{{ p.email or "-" }}</td>
        <td class="px-4 py-3">{{ p.telefono or "-" }}</td>
        <td class="px-4 py-3 text-center">
          <a href="/proveedores/{{ p.id }}" class="text-blue-600 mr-2">Ver</a>
          <a href="/proveedores/{{ p.id }}/edit" class="text-yellow-600">Editar</a>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="5" class="px-4 py-8 text-center">No hay proveedores</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
