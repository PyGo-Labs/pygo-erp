{% extends "base.html" %}

{% block content %}
<div class="flex justify-between items-center mb-6">
  <h2 class="text-xl font-bold">Configuración</h2>
  <button onclick="guardarConfig()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
    Guardar Cambios
  </button>
</div>

<form id="config-form" method="POST" action="/configuracion" class="space-y-6">
  <div class="bg-white rounded-lg shadow p-6">
    <h3 class="text-lg font-semibold mb-4">Información de la Empresa</h3>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">RFC</label>
        <input type="text" name="rfc" value="{{ config.rfc or "" }}" class="w-full px-4 py-2 border rounded-lg">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Razón Social</label>
        <input type="text" name="razon_social" value="{{ config.razon_social or "" }}" class="w-full px-4 py-2 border rounded-lg">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" name="email" value="{{ config.email or "" }}" class="w-full px-4 py-2 border rounded-lg">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Teléfono</label>
        <input type="text" name="telefono" value="{{ config.telefono or "" }}" class="w-full px-4 py-2 border rounded-lg">
      </div>
    </div>
  </div>

  <div class="bg-white rounded-lg shadow p-6">
    <h3 class="text-lg font-semibold mb-4">Finanzas</h3>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Moneda</label>
        <select name="moneda" class="w-full px-4 py-2 border rounded-lg">
          <option value="MXN" {{ "selected" if config.moneda == "MXN" else "" }}>MXN - Peso Mexicano</option>
          <option value="USD" {{ "selected" if config.moneda == "USD" else "" }}>USD - Dólar</option>
          <option value="EUR" {{ "selected" if config.moneda == "EUR" else "" }}>EUR - Euro</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">IVA Predeterminado (%)</label>
        <input type="number" step="0.01" name="iva_default" value="{{ config.iva_default or "16.00" }}" class="w-full px-4 py-2 border rounded-lg">
      </div>
    </div>
  </div>

  <div class="bg-white rounded-lg shadow p-6">
    <h3 class="text-lg font-semibold mb-4">Sistema</h3>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Idioma</label>
        <select name="idioma" class="w-full px-4 py-2 border rounded-lg">
          <option value="es" {{ "selected" if config.idioma == "es" else "" }}>Español</option>
          <option value="en" {{ "selected" if config.idioma == "en" else "" }}>English</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Zona horaria</label>
        <select name="zona_horaria" class="w-full px-4 py-2 border rounded-lg">
          <option value="America/Mexico_City" {{ "selected" if config.zona_horaria == "America/Mexico_City" else "" }}>Ciudad de México</option>
          <option value="America/Bogota" {{ "selected" if config.zona_horaria == "America/Bogota" else "" }}>Bogotá</option>
          <option value="America/Madrid" {{ "selected" if config.zona_horaria == "America/Madrid" else "" }}>Madrid</option>
        </select>
      </div>
    </div>
  </div>
</form>

<script>
function guardarConfig() {
  document.getElementById('config-form').submit();
}
</script>
{% endblock %}
