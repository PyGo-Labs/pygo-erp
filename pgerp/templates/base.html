<!DOCTYPE html>
<html lang="{{ i18n.lang }}" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyGo ERP{% if title %} — {{ title }}{% endif %}</title>
  <script src="https://unpkg.com/htmx@2.0.0/dist/htmx.js"></script>
  <script src="https://unpkg.com/alpinejs@3.x/dist/cdn.min.js" defer></script>
  <link href="https://cdn.pygo.dev/ui/v0.5.0/pygo-ui.css" rel="stylesheet">
  <script src="/static/js/app.js" defer></script>
</head>
<body class="bg-slate-50 font-sans h-full">
  <div x-data="{ mobileOpen: false }" class="flex h-full">
    <!-- Sidebar -->
    <aside :class="{'w-64': !mobileOpen, 'w-0': mobileOpen}" class="bg-slate-900 text-white overflow-y-auto transition-all duration-300">
      <nav class="py-4">
        <a href="/dashboard" class="flex items-center gap-3 px-4 py-3 text-blue-400 hover:bg-slate-800 rounded-lg mx-2">
          <Icon name="home" class="w-5 h-5" />
          <span>Dashboard</span>
        </a>
        <a href="/productos" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-lg mx-2">
          <Icon name="package" class="w-5 h-5" />
          <span>Productos</span>
        </a>
        <a href="/clientes" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-lg mx-2">
          <Icon name="users" class="w-5 h-5" />
          <span>Clientes</span>
        </a>
        <a href="/proveedores" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-lg mx-2">
          <Icon name="truck" class="w-5 h-5" />
          <span>Proveedores</span>
        </a>
        <a href="/facturas" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-lg mx-2">
          <Icon name="file-text" class="w-5 h-5" />
          <span>Facturas</span>
        </a>
        <a href="/pedidos" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-lg mx-2">
          <Icon name="shopping-cart" class="w-5 h-5" />
          <span>Pedidos</span>
        </a>
        <a href="/inventario" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-lg mx-2">
          <Icon name="box" class="w-5 h-5" />
          <span>Inventario</span>
        </a>
        <a href="/empleados" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-lg mx-2">
          <Icon name="users" class="w-5 h-5" />
          <span>Empleados</span>
        </a>
        <a href="/proyectos" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-lg mx-2">
          <Icon name="folder" class="w-5 h-5" />
          <span>Proyectos</span>
        </a>
        <a href="/reportes/ventas" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-lg mx-2">
          <Icon name="bar-chart" class="w-5 h-5" />
          <span>Reportes</span>
        </a>
        <a href="/configuracion" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-lg mx-2">
          <Icon name="settings" class="w-5 h-5" />
          <span>Configuración</span>
        </a>
      </nav>
    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-y-auto">
      <!-- Header -->
      <header class="bg-white shadow-sm border-b px-6 py-4">
        <div class="flex justify-between items-center">
          <h1 class="text-xl font-bold text-gray-900">{{ title or 'PyGo ERP' }}</h1>
          <div class="flex items-center gap-4">
            {% if current_user %}
              <span class="text-sm text-gray-600">
                {{ current_user.nombre }} • {{ current_user.empresa.nombre }}
              </span>
              <form method="POST" action="/logout" class="inline">
                <button type="submit" class="text-sm text-gray-500 hover:text-gray-900">
                  <Icon name="log-out" class="w-4 h-4 inline" /> Salir
                </button>
              </form>
            {% endif %}
          </div>
        </div>
      </header>

      <!-- Page content -->
      <div class="p-6">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
