{% extends "layouts/base.html" %}
{% block title %}Dashboard — PyGo ERP{% endblock %}

{% block content %}
<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
  <div class="bg-white p-4 rounded-lg shadow">
    <h3 class="text-sm text-gray-500">Productos</h3>
    <p class="text-2xl font-bold text-blue" id="kpi-productos">...</p>
  </div>
  <div class="bg-white p-4 rounded-lg shadow">
    <h3 class="text-sm text-gray-500">Clientes</h3>
    <p class="text-2xl font-bold text-green" id="kpi-clientes">...</p>
  </div>
  <div class="bg-white p-4 rounded-lg shadow">
    <h3 class="text-sm text-gray-500">Facturas</h3>
    <p class="text-2xl font-bold text-yellow" id="kpi-facturas">...</p>
  </div>
  <div class="bg-white p-4 rounded-lg shadow">
    <h3 class="text-sm text-gray-500">Inventario</h3>
    <p class="text-2xl font-bold text-dark" id="kpi-inventario">...</p>
  </div>
</div>

<!-- HTMX: carga datos dinámicos -->
<script>
  htmx.on('htmx:loaded', function(evt) {
    htmx.get('/api/health', { swap: 'outerHTML' });
  });
</script>
{% endblock %}
