<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PyGo ERP — Dashboard</title>
  <script src="https://unpkg.com/htmx.org@2.0.1"></script>
  <script src="https://unpkg.com/alpinejs@3.13.0/dist/cdn.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Auto-refresh counts every 5s
    document.addEventListener('DOMContentLoaded', function() {
      function refresh() {
        fetch('/api/productos').then(r => r.json()).then(d => {
          document.getElementById('productos-count').innerText = d.result ? d.result.length : 0;
        });
        fetch('/api/clientes').then(r => r.json()).then(d => {
          document.getElementById('clientes-count').innerText = d.result ? d.result.length : 0;
        });
        fetch('/api/facturas').then(r => r.json()).then(d => {
          document.getElementById('facturas-count').innerText = d.result ? d.result.length : 0;
        });
      }
      refresh();
      setInterval(refresh, 5000);
    });
  </script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="container mx-auto p-6">
    <h1 class="text-3xl font-bold text-[#2563EB] mb-2">PyGo ERP</h1>
    <p class="text-gray-600 mb-6">Dual-Language Architecture — Go + Python</p>

    <!-- Status cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-semibold text-gray-700">Productos</h3>
        <p class="text-2xl text-[#2563EB]" id="productos-count">0</p>
      </div>
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-semibold text-gray-700">Clientes</h3>
        <p class="text-2xl text-[#10B981]" id="clientes-count">0</p>
      </div>
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-semibold text-gray-700">Facturas</h3>
        <p class="text-2xl text-[#F59E0B]" id="facturas-count">0</p>
      </div>
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-semibold text-gray-700">Status</h3>
        <p class="text-2xl text-purple-600">Active</p>
      </div>
    </div>

    <!-- Navigation links -->
    <div class="flex space-x-4">
      <a href="/productos" class="bg-white px-4 py-2 rounded shadow hover:bg-gray-50">📦 Productos</a>
      <a href="/clientes" class="bg-white px-4 py-2 rounded shadow hover:bg-gray-50">👥 Clientes</a>
      <a href="/facturas" class="bg-white px-4 py-2 rounded shadow hover:bg-gray-50">🧾 Facturas</a>
      <a href="/ventas" class="bg-white px-4 py-2 rounded shadow hover:bg-gray-50">💰 Ventas</a>
      <a href="/compras" class="bg-white px-4 py-2 rounded shadow hover:bg-gray-50">🛒 Compras</a>
      <a href="/inventario" class="bg-white px-4 py-2 rounded shadow hover:bg-gray-50">📊 Inventario</a>
      <a href="/contabilidad" class="bg-white px-4 py-2 rounded shadow hover:bg-gray-50">📒 Contabilidad</a>
      <a href="/tesoreria" class="bg-white px-4 py-2 rounded shadow hover:bg-gray-50">🏦 Tesorería</a>
      <a href="/rrhh" class="bg-white px-4 py-2 rounded shadow hover:bg-gray-50">👔 RRHH</a>
      <a href="/produccion" class="bg-white px-4 py-2 rounded shadow hover:bg-gray-50">🏭 Producción</a>
      <a href="/setup" class="bg-white px-4 py-2 rounded shadow hover:bg-gray-50">⚙️ Configuración inicial</a>
    </div>
  </div>
</body>
</html>
