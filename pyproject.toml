[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygo-erp"
version = "0.1.0"
description = "ERP database models + CRUD routes for PyGo Framework showcase"
authors = [{ name = "PyGo Labs", email = "dev@pygo.dev" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pygo-framework>=1.2.0",
    "pygo-ui>=0.5.0",
    "pygo-multitenancy>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/PyGo-labs/pygo-erp"
Documentation = "https://pygo.dev/erp"

[tool.pygo]
name = "pygo-erp"
version = "0.1.0"
